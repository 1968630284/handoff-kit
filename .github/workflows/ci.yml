name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 4.10.1
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          $r = Invoke-Pester ./tests/Handoff.Tests.ps1 -PassThru -Quiet
          "passed=$($r.PassedCount) failed=$($r.FailedCount)"
          if ($r.FailedCount -gt 0 -or $r.PassedCount -eq 0) { exit 1 }
